name: Keep https://finder-locw.onrender.com/ alive
# Finder is run on a Render free-tier web service.
# This means it sleeps when not checked on for 15 minutes.
# So this is a script that checks on it every 14 mins!

on:
  schedule:
    - cron: "*/14 * * * *"  # every 14 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Render app
        run: curl -s https://finder-locw.onrender.com > /dev/null